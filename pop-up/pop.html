<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pop Up model</title>
    <link rel="stylesheet" href="./pop.css" />
  </head>
  <body>
    <button class="trigger-btn" id="showModal">Show Modal</button>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-circle" id="circle">

        <div class="modal">
          <div class="btn-container">
            <button class="arrow-btn" id="">&larr;</button>
            <button class="close-btn" id="closeBtn">&times;</button>
          </div>
          <div class="modal-header">
            <h2>Create a post</h2>
          </div>
          <div class="modal-body">
            <p>
              Lorem ipsum dolor, sit amet consectetur adipisicing elit. Animi aut
              laboriosam excepturi vel at quisquam in iure debitis!
            </p>
          </div>
          <div class="modal-header">
            <h2>Campaign Name</h2>
          </div>
          <div class="modal-body">
            <label>
              <input placeholder="Ex. Get 50% off" />
            </label>
          </div>
          <div class="modal-footer">
            <button class="modal-btn primary" id="confirmBtn">Confirm</button>
            <button class="modal-btn secondary" id="cancelBtn">Cancel</button>
          </div>
        </div>
      </div>
    </div>
    <script src="./pop.js"></script>
  </body>
</html>
