<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download buttons</title>
    <link rel="stylesheet" href="./button.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  </head>
  <body>
    <div class="store-buttons">
      <a href="#" class="store-btn google">
        <span class="icon"><i class="fa-brands fa-android"></i></span>
        <span class="text">
          <small>Download from</small>
          <strong>Google Play</strong>
        </span>
      </a>

      <a href="#" class="store-btn apple">
        <span class="icon"><i class="fa-brands fa-apple"></i></span>
        <span class="text">
          <small>Download from</small>
          <strong>App Store</strong>
        </span>
      </a>

      <a href="#" class="store-btn windows">
        <span class="icon"><i class="fa-brands fa-windows"></i></span>
        <span class="text">
          <small>Download from</small>
          <strong>Windows Store</strong>
        </span>
      </a>
    </div>
  </body>
</html>
